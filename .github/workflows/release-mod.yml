name: Prepare Mod Release

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-tag-and-draft-release:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse unpublished Workshop sentinel
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < About/PublishedFileId.txt)" != "0" || {
            echo "Replace PublishedFileId.txt with the real Workshop item ID before release." >&2
            exit 1
          }

      - name: Determine release metadata
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import xml.etree.ElementTree as ET

          root = ET.parse("Directory.Build.props").getroot()

          def read_value(name: str) -> str:
              value = root.findtext(f".//{name}", "").strip()
              if not value:
                  raise SystemExit(f"Directory.Build.props is missing {name}.")
              return value

          mod_name = read_value("ModName")
          mod_version = read_value("ModVersion")
          print(f"MOD_NAME={mod_name}")
          print(f"MOD_VERSION={mod_version}")
          print(f"RELEASE_TAG=v{mod_version}")
          PY

      - name: Create or verify release tag
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA" || {
              echo "$RELEASE_TAG already points at another commit." >&2
              exit 1
            }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Create draft GitHub release if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --title "$MOD_NAME $RELEASE_TAG" --generate-notes --draft

      - name: Publish latest manifest ref
        run: |
          set -euo pipefail
          git tag --force latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest
